<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkEdu — Connexion</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="connexion.css">
</head>
<body>

  <div class="auth-wrapper">
    <!-- Zone d'illustration dynamique selon le profil -->
    <header class="auth-hero-slider login-header" id="loginHeader">
      <div class="hero-top-bar">
        <a href="index.html" class="burger-btn back-btn" aria-label="Retour à l'accueil" title="Accueil">
          <i class="fa-solid fa-arrow-left"></i>
        </a>

        <!-- Contrôles Thème & Langue -->
        <div class="header-actions">
          <button type="button" id="langToggleBtn" class="action-circle-btn" title="Changer de langue / Change language">
            <span id="langLabel">EN</span>
          </button>
          <button type="button" id="themeToggleBtn" class="action-circle-btn" title="Changer le thème">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
          </button>
        </div>
      </div>
      
      <!-- Conteneur Image d'illustration par rôle -->
      <div class="hero-image-container">
        <img id="roleHeroImg" src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=600" alt="Illustration Profil" class="hero-profile-img">
        <div class="hero-img-overlay"></div>
      </div>

      <div class="hero-content-center">
        <div class="role-icon-badge">
          <i id="loginIcon" class="fa-solid fa-user-graduate"></i>
        </div>
        <h1 id="loginTitle">Espace Élève</h1>
        <p id="loginSubtitle" class="hero-desc">Connecte-toi pour suivre ton parcours scolaire.</p>
      </div>
    </header>

    <!-- Panneau inférieur : Formulaire de connexion -->
    <main class="auth-sheet login-sheet">
      <form class="login-form" id="loginForm">
        
        <!-- Champ Identifiant ou Email -->
        <div class="input-group">
          <label for="userInput" class="input-label" id="inputLabelText">Identifiant ou Email</label>
          <div class="input-field-wrapper">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="text" id="userInput" placeholder="ex: LE-2026-045" required class="form-input">
          </div>
        </div>

        <!-- Champ Mot de passe -->
        <div class="input-group">
          <label for="passwordInput" class="input-label" id="passwordLabelText">Mot de passe</label>
          <div class="input-field-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input type="password" id="passwordInput" placeholder="••••••••" required class="form-input password-input">
            <button type="button" id="togglePasswordBtn" class="toggle-password-btn" aria-label="Afficher ou masquer le mot de passe">
              <i class="fa-solid fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Options du formulaire -->
        <div class="form-options">
          <label class="remember-me" id="rememberLabel">
            <input type="checkbox" id="rememberCheckbox"> Se souvenir de moi
          </label>
          <a href="#" class="forgot-password" id="forgotPasswordLink">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn-primary-action" id="submitBtn">Se connecter</button>

        <!-- Footer -->
        <footer class="page-footer">
          <p id="footerText">© 2026 LinkEdu — Développé par Jean Junior DIRAMBA MAMBOUNDOU | École 241 (Bikélé, Gabon)</p>
        </footer>
      </form>
    </main>

  </div>

  <script src="connexion.js"></script>
</body>
</html>
